<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novare Health Solutions LLC | Psychiatric Medication Management & Therapy Maryland</title>
    <meta name="description" content="Novare Health Solutions LLC provides compassionate, evidence-based outpatient psychiatric evaluations, telepsychiatry, and medication management for adults in Maryland. Led by Oluchi Ukah, MSN, APRN, PMHNP-BC.">
    <style>
        :root {
            --primary: #1a365d;
            --primary-light: #2a4365;
            --accent: #2f855a;
            --accent-hover: #22543d;
            --dark: #2d3748;
            --light: #f7fafc;
            --border: #e2e8f0;
            --text-gray: #4a5568;
            --crisis-red: #e53e3e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background: var(--light); color: var(--dark); line-height: 1.6; }
        
        /* Navigation */
        header { background: white; padding: 1rem 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo-group { display: flex; flex-direction: column; text-decoration: none; }
        .logo-main { font-weight: 700; color: var(--primary); font-size: 1.4rem; letter-spacing: -0.5px; }
        .logo-sub { font-size: 0.75rem; text-transform: uppercase; color: var(--accent); letter-spacing: 1px; font-weight: 600; margin-top: -2px; }
        .nav-links { display: flex; align-items: center; }
        .nav-links a { margin-left: 1.5rem; text-decoration: none; color: var(--text-gray); font-weight: 500; font-size: 0.95rem; transition: color 0.2s; }
        .nav-links a:hover { color: var(--primary); }
        .nav-links .btn-nav { background: var(--accent); color: white; padding: 0.5rem 1rem; border-radius: 4px; font-weight: 600; }
        .nav-links .btn-nav:hover { background: var(--accent-hover); color: white; }

        /* Crisis Alert Ribbon */
        .crisis-ribbon { background: #fff5f5; border-bottom: 2px solid var(--crisis-red); padding: 0.75rem 1.5rem; text-align: center; color: #c53030; font-size: 0.95rem; font-weight: 600; }
        .crisis-ribbon a { color: #9b2c2c; text-decoration: underline; }

        /* Hero */
        .hero { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: white; padding: 6rem 1.5rem; text-align: center; }
        .hero-content { max-width: 850px; margin: 0 auto; }
        .hero h1 { font-size: 2.75rem; font-weight: 700; margin-bottom: 1.25rem; letter-spacing: -0.5px; line-height: 1.2; }
        .hero p { font-size: 1.2rem; margin-bottom: 2.5rem; color: #e2e8f0; font-weight: 400; max-width: 700px; margin-left: auto; margin-right: auto; }
        .btn-primary { background: var(--accent); color: white; padding: 0.9rem 2.25rem; border-radius: 6px; font-weight: 600; text-decoration: none; font-size: 1.1rem; border: none; cursor: pointer; transition: all 0.2s; display: inline-block; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }

        /* Main Container layout */
        .container { max-width: 1200px; margin: 0 auto; padding: 5rem 1.5rem; }
        .section-title { font-size: 2rem; color: var(--primary); font-weight: 700; margin-bottom: 1rem; letter-spacing: -0.5px; text-align: center; }
        .section-subtitle { text-align: center; color: var(--text-gray); font-size: 1.1rem; max-width: 700px; margin: 0 auto 3rem auto; }
        
        /* About Provider section */
        .provider-grid { display: grid; grid-template-columns: 260px 1fr; gap: 3.5rem; align-items: start; }
        .provider-meta { text-align: center; background: white; padding: 2rem 1.5rem; border-radius: 8px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .provider-avatar { width: 150px; height: 150px; border-radius: 50%; background: #e2e8f0; display: inline-flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--primary-light); font-weight: bold; border: 4px solid var(--light); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .provider-meta h3 { color: var(--primary); font-size: 1.25rem; margin-top: 1rem; }
        .provider-badge { font-size: 0.75rem; text-transform: uppercase; color: var(--accent); font-weight: 700; letter-spacing: 0.5px; margin-top: 0.25rem; }
        .provider-bio p { font-size: 1.05rem; color: var(--text-gray); margin-bottom: 1.25rem; }
        .credentials-list { margin-top: 1.5rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; background: var(--light); padding: 1.5rem; border-radius: 6px; border: 1px solid var(--border); }
        .credentials-list li { list-style: none; font-size: 0.95rem; color: var(--dark); display: flex; align-items: center; gap: 0.5rem; }

        /* Philosophy Tabs */
        .principles-section { background: white; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 5rem 1.5rem; }
        .tabs-container { max-width: 850px; margin: 0 auto; }
        .tabs-header { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem; border-bottom: 2px solid var(--border); padding-bottom: 1rem; }
        .tab-btn { background: none; border: none; padding: 0.6rem 1.75rem; font-size: 1rem; font-weight: 600; color: #718096; cursor: pointer; border-radius: 4px; transition: all 0.2s; }
        .tab-btn:hover { color: var(--primary); background: var(--light); }
        .tab-btn.active { color: white; background: var(--primary); }
        .tab-content { background: var(--light); padding: 2rem; border-radius: 8px; border: 1px solid var(--border); display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease; }

        /* Services Grid */
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 2rem; }
        .service-card { background: white; padding: 2.25rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-top: 4px solid var(--primary); border-left: 1px solid var(--border); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
        .service-card h3 { color: var(--primary); font-size: 1.25rem; margin-bottom: 0.75rem; }
        .service-card p { color: var(--text-gray); font-size: 0.95rem; }

        /* Who We Serve */
        .serve-box { background: white; padding: 3rem; border-radius: 8px; border: 1px solid var(--border); }
        .serve-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
        .serve-item { background: var(--light); padding: 1rem 1.25rem; border-radius: 6px; border-left: 4px solid var(--accent); font-weight: 600; color: var(--primary); font-size: 1rem; }

        /* Insurance & Fees */
        .finance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; }
        .finance-card { background: white; padding: 2.5rem; border-radius: 8px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .finance-card h3 { color: var(--primary); font-size: 1.3rem; margin-bottom: 1.25rem; border-bottom: 2px solid var(--light); padding-bottom: 0.75rem; }
        .fee-list li { list-style: none; margin-bottom: 0.75rem; display: flex; justify-content: space-between; font-size: 1rem; color: var(--text-gray); }
        .fee-list li span { font-weight: 700; color: var(--dark); }
        .policy-text { font-size: 0.95rem; color: var(--text-gray); margin-top: 1rem; }

        /* Scheduling Hub */
        .intake-box { background: white; padding: 4rem 2rem; border-radius: 8px; border: 1px solid var(--border); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); text-align: center; max-width: 900px; margin: 0 auto; }
        .scheduler-hub { margin-top: 2.5rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; text-align: left; }
        .hub-option { background: var(--light); padding: 1.75rem; border-radius: 6px; border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: space-between; }
        .hub-option h4 { color: var(--primary); font-size: 1.1rem; margin-bottom: 0.5rem; }
        .hub-option p { font-size: 0.85rem; color: var(--text-gray); margin-bottom: 1.25rem; }
        .btn-hub { display: block; text-align: center; background: var(--primary); color: white; padding: 0.6rem 1rem; border-radius: 4px; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: background 0.2s; }
        .btn-hub:hover { background: var(--primary-light); }
        .btn-hub.alt { background: var(--accent); }
        .btn-hub.alt:hover { background: var(--accent-hover); }
        .btn-hub.gray { background: #718096; }
        .btn-hub.gray:hover { background: #4a5568; }

        /* Footer & Trust Disclaimers */
        footer { background: #1a202c; color: #a0aec0; padding: 4rem 1.5rem; font-size: 0.85rem; border-top: 4px solid var(--primary); }
        .footer-container { max-width: 1200px; margin: 0 auto; }
        .alert-panel { background: #2d3748; padding: 1.5rem; border-radius: 6px; margin-bottom: 2rem; border-left: 4px solid var(--crisis-red); color: #cbd5e0; }
        .alert-panel strong { color: white; display: block; margin-bottom: 0.5rem; font-size: 1rem; }
        .bottom-bar { border-top: 1px solid #4a5568; padding-top: 1.5rem; margin-top: 2rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
